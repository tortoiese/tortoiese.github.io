<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이승환 | Portfolio</title>
  <style>
    :root {
      --bg: #0f1221;
      --card: #1a1f35;
      --accent: #6ea8fe;
      --text: #e8ecf5;
      --muted: #9aa4bf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: linear-gradient(160deg, #0f1221 0%, #151a30 100%);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 48px 20px 80px; }
    header {
      text-align: center;
      padding: 40px 0 48px;
    }
    header h1 { font-size: 2.6rem; letter-spacing: -1px; }
    header p { color: var(--accent); margin-top: 8px; font-weight: 500; }
    section {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 28px 30px;
      margin-bottom: 20px;
    }
    section h2 {
      font-size: 1.25rem;
      margin-bottom: 12px;
      color: var(--accent);
    }
    section p { color: var(--muted); }
    .projects-grid { display: grid; gap: 14px; }
    .card {
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 16px 18px;
    }
    .card h3 { font-size: 1.05rem; margin-bottom: 4px; }
    .card span { color: var(--muted); font-size: 0.92rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>이승환</h1>
      <p>Security &amp; Frontend Developer</p>
    </header>

    <section id="about">
      <h2>About</h2>
      <p>사이버 보안을 공부하는 학생입니다. 화이트햇 스쿨 4기에서 시스템 해킹, 리버스 엔지니어링, 웹 해킹 등을 학습하고 있습니다.</p>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <div class="projects-grid">
        <div class="card">
          <h3>백신 탐지 우회 기법 연구</h3>
          <span>AV/EDR 우회 기법 고도화 및 논문 작성</span>
        </div>
        <div class="card">
          <h3>CVE 재현 &amp; 리버스 엔지니어링</h3>
          <span>윈도우 애플리케이션 분석 및 취약점 재현</span>
        </div>
        <div class="card">
          <h3>웹 해킹 원리 연구</h3>
          <span>웹 취약점 분석 및 시큐어 코딩</span>
        </div>
      </div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>GitHub: <a href="https://github.com/tortoiese">@tortoiese</a></p>
    </section>

    <footer>© 2026 이승환 · WHS 4th</footer>
  </div>
</body>
</html>
