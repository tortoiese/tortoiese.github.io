backend:
  name: github
  repo: tortoiese/tortoiese.github.io   # GitHub 사용자/저장소
  branch: main
  # OAuth 중계 서버(Cloudflare Worker) 주소
  base_url: https://tortoiese-github-io.albert419311.workers.dev

# 업로드되는 이미지 저장 위치
media_folder: assets/img/uploads
public_folder: /assets/img/uploads

# 편집 UI 언어
locale: ko

collections:
  - name: portfolio
    label: 포트폴리오
    files:
      - name: content
        label: 전체 내용
        file: _data/portfolio.yml
        fields:
          - label: 첫 화면 (Hero)
            name: site
            widget: object
            fields:
              - { label: "핸들 (헤더 로고 + 큰 글씨)", name: handle, widget: string }
              - { label: 이름 (한글), name: name_ko, widget: string }
              - { label: 이름 (영문), name: name_en, widget: string, required: false }
              - { label: 한 줄 소개, name: title, widget: string }
              - label: 소개 문장
                name: intro
                widget: list
                field: { label: 문장, name: line, widget: string }
              - { label: 프로필 사진, name: photo, widget: image, required: false }

          - label: 링크
            name: links
            widget: object
            fields:
              - { label: GitHub URL, name: github, widget: string, required: false }
              - { label: 블로그 URL, name: blog, widget: string, required: false }
              - { label: 이메일, name: email, widget: string, required: false }
              - { label: LinkedIn URL, name: linkedin, widget: string, required: false, hint: "비워두면 표시되지 않습니다." }

          - label: 프로젝트 (최신순)
            name: projects
            widget: list
            label_singular: 프로젝트
            summary: "{{fields.name}}"
            fields:
              - { label: 이름, name: name, widget: string }
              - { label: 부제, name: subtitle, widget: string, required: false }
              - { label: 상태, name: status, widget: string, required: false, hint: "예) 진행 중 — 비워두면 표시 안 됨" }
              - { label: 기간, name: period, widget: string, required: false, hint: "예) 2026.03 ~ 2026.06" }
              - { label: 설명, name: desc, widget: text }
              - { label: 맡은 일, name: role, widget: string, required: false }
              - { label: 기술, name: stack, widget: string, required: false, hint: "예) React / Vite / axios" }
              - { label: GitHub 링크, name: github, widget: string, required: false }
              - { label: 데모 링크, name: demo, widget: string, required: false }
              - label: 기타 링크
                name: links
                widget: list
                required: false
                collapsed: true
                label_singular: 링크
                summary: "{{fields.label}}"
                hint: "발표자료, 블로그 글, 수상 기사 등. GitHub/데모 옆에 함께 표시됩니다."
                fields:
                  - { label: 이름, name: label, widget: string, hint: "예) 발표자료, 회고 글" }
                  - { label: URL, name: url, widget: string }
              - label: 증빙 사진
                name: images
                widget: list
                required: false
                collapsed: true
                label_singular: 사진
                summary: "{{fields.caption}}"
                hint: "썸네일로 표시되고, 누르면 원본이 새 탭에서 열립니다."
                fields:
                  - { label: 사진, name: image, widget: image, choose_url: true }
                  - { label: 설명, name: caption, widget: string, required: false, hint: "예) 수상 사진, 실행 화면" }
              - label: 증빙 영상
                name: videos
                widget: list
                required: false
                collapsed: true
                label_singular: 영상
                summary: "{{fields.caption}}"
                hint: "YouTube 링크는 페이지에 바로 재생되게 넣어집니다. 파일 업로드는 mp4/webm, 용량이 작은 것(수십 MB 이하)만 권장합니다."
                fields:
                  - { label: 영상 링크 (YouTube 등), name: url, widget: string, required: false }
                  - { label: 또는 영상 파일 업로드, name: file, widget: file, required: false }
                  - { label: 설명, name: caption, widget: string, required: false }
              - label: 증빙 문서 (PDF)
                name: documents
                widget: list
                required: false
                collapsed: true
                label_singular: 문서
                summary: "{{fields.label}}"
                hint: "참가확인서, 수료증, 상장 등. 미리보기 사진을 넣으면 사진 칸에 썸네일로 나오고, 누르면 PDF가 열립니다. 미리보기가 없으면 링크로만 표시됩니다."
                fields:
                  - { label: 이름, name: label, widget: string, hint: "예) 해커톤 참가확인서" }
                  - { label: PDF 파일, name: file, widget: file }
                  - { label: 미리보기 사진, name: preview, widget: image, required: false, hint: "PDF 첫 페이지를 캡처한 이미지 (선택)" }

          - label: 활동 · 수상 · 자격증
            name: activities
            widget: list
            label_singular: 항목
            summary: "{{fields.name}}"
            fields:
              - { label: 이름, name: name, widget: string }
              - { label: 부제/기관, name: subtitle, widget: string, required: false }
              - { label: 기간, name: period, widget: string, required: false }
              - { label: 설명, name: desc, widget: text, required: false }

          - label: 학력
            name: education
            widget: list
            label_singular: 학교
            summary: "{{fields.school}}"
            fields:
              - { label: 학교, name: school, widget: string }
              - { label: 캠퍼스/계열, name: campus, widget: string, required: false }
              - { label: 기간, name: period, widget: string, required: false }
              - { label: 설명, name: desc, widget: text, required: false }

          - label: 보유기술
            name: skills
            widget: list
            label_singular: 기술 분류
            summary: "{{fields.category}}"
            fields:
              - { label: 분류, name: category, widget: string }
              - { label: 항목, name: items, widget: string, hint: "쉼표(,)로 구분해서 입력하세요. 예) Python, C, Rust" }

          - label: Contact
            name: contact
            widget: object
            fields:
              - { label: 안내 문구, name: lead, widget: string, required: false }
