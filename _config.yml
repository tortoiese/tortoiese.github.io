title: 이승환 | Portfolio
description: 정보보안을 공부하는 프론트엔드 개발자
lang: ko

# GitHub Pages가 Jekyll로 빌드합니다.
# admin 폴더(Decap CMS)는 그대로 복사되도록 처리에서 제외하지 않습니다.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - wrangler.toml
  - src
  - node_modules
  - template          # 새 디자인 원본(플레이스홀더 버전) — 배포 제외

# 마크다운 엔진
markdown: kramdown
